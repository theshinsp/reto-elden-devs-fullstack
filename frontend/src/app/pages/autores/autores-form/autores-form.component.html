<div class="container">
  <div class="card" style="max-width:560px; margin:0 auto;">

    <h2 class="page-title">
      {{ editando() ? 'Editar Autor' : 'Nuevo Autor' }}
    </h2>

    <div *ngIf="error()" class="alert alert-error">{{ error() }}</div>

    <form [formGroup]="form" (ngSubmit)="guardar()">

      <div class="form-group">
        <label for="autor">Autor *</label>
        <input
          id="autor"
          type="text"
          formControlName="autor"
          placeholder="Ej: Gabriel Garcia Marquez"
          [class.input-error]="autor?.invalid && autor?.touched"
        />
        <span class="error-msg" *ngIf="autor?.errors?.['required'] && autor?.touched">
          El nombre del autor es obligatorio.
        </span>
        <span class="error-msg" *ngIf="autor?.errors?.['minlength'] && autor?.touched">
          Minimo 2 caracteres.
        </span>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="guardando()">
          {{ guardando() ? 'Guardando...' : (editando() ? 'Actualizar' : 'Guardar') }}
        </button>
        <a routerLink="/autores" class="btn btn-secondary">Cancelar</a>
      </div>

    </form>
  </div>
</div>
