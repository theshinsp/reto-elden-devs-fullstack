<div class="container">
  <div class="card" style="max-width:560px; margin:0 auto;">

    <h2 class="page-title">
      {{ editando() ? '✏️ Editar Autor' : '➕ Nuevo Autor' }}
    </h2>

    <div *ngIf="error()" class="alert alert-error">⚠️ {{ error() }}</div>

    <form [formGroup]="form" (ngSubmit)="guardar()">

      <!-- Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre *</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          placeholder="Ej: Gabriel"
          [class.input-error]="nombre?.invalid && nombre?.touched"
        />
        <span class="error-msg" *ngIf="nombre?.errors?.['required'] && nombre?.touched">
          El nombre es obligatorio.
        </span>
        <span class="error-msg" *ngIf="nombre?.errors?.['minlength'] && nombre?.touched">
          Mínimo 2 caracteres.
        </span>
      </div>

      <!-- Apellidos -->
      <div class="form-group">
        <label for="apellidos">Apellidos *</label>
        <input
          id="apellidos"
          type="text"
          formControlName="apellidos"
          placeholder="Ej: García Márquez"
          [class.input-error]="apellidos?.invalid && apellidos?.touched"
        />
        <span class="error-msg" *ngIf="apellidos?.errors?.['required'] && apellidos?.touched">
          Los apellidos son obligatorios.
        </span>
        <span class="error-msg" *ngIf="apellidos?.errors?.['minlength'] && apellidos?.touched">
          Mínimo 2 caracteres.
        </span>
      </div>

      <!-- Nacionalidad -->
      <div class="form-group">
        <label for="nacionalidad">Nacionalidad *</label>
        <input
          id="nacionalidad"
          type="text"
          formControlName="nacionalidad"
          placeholder="Ej: Colombiana"
          [class.input-error]="nacionalidad?.invalid && nacionalidad?.touched"
        />
        <span class="error-msg" *ngIf="nacionalidad?.errors?.['required'] && nacionalidad?.touched">
          La nacionalidad es obligatoria.
        </span>
      </div>

      <!-- Botones -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="guardando()">
          {{ guardando() ? 'Guardando...' : (editando() ? 'Actualizar' : 'Guardar') }}
        </button>
        <a routerLink="/autores" class="btn btn-secondary">Cancelar</a>
      </div>

    </form>
  </div>
</div>
