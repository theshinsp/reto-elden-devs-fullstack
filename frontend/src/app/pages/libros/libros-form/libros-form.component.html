<div class="container">
  <div class="card" style="max-width:560px; margin:0 auto;">

    <h2 class="page-title">
      {{ editando() ? '✏️ Editar Libro' : '➕ Nuevo Libro' }}
    </h2>

    <div *ngIf="error()" class="alert alert-error">⚠️ {{ error() }}</div>

    <form [formGroup]="form" (ngSubmit)="guardar()">

      <!-- Título -->
      <div class="form-group">
        <label for="titulo">Título *</label>
        <input id="titulo" type="text" formControlName="titulo"
          placeholder="Ej: Cien años de soledad"
          [class.input-error]="titulo?.invalid && titulo?.touched"/>
        <span class="error-msg" *ngIf="titulo?.errors?.['required'] && titulo?.touched">El título es obligatorio.</span>
        <span class="error-msg" *ngIf="titulo?.errors?.['minlength'] && titulo?.touched">Mínimo 2 caracteres.</span>
      </div>

      <!-- Autor -->
      <div class="form-group">
        <label for="autorId">Autor *</label>
        <select id="autorId" formControlName="autorId"
          [class.input-error]="autorId?.invalid && autorId?.touched">
          <option value="">-- Selecciona un autor --</option>
          <option *ngFor="let autor of autores()" [value]="autor.id">
            {{ autor.nombre }} {{ autor.apellidos }}
          </option>
        </select>
        <span class="error-msg" *ngIf="autorId?.errors?.['required'] && autorId?.touched">Debes seleccionar un autor.</span>
      </div>

      <!-- Género -->
      <div class="form-group">
        <label for="genero">Género *</label>
        <input id="genero" type="text" formControlName="genero"
          placeholder="Ej: Novela, Ciencia ficción..."
          [class.input-error]="genero?.invalid && genero?.touched"/>
        <span class="error-msg" *ngIf="genero?.errors?.['required'] && genero?.touched">El género es obligatorio.</span>
      </div>

      <!-- Año publicación -->
      <div class="form-group">
        <label for="anioPublicacion">Año de publicación *</label>
        <input id="anioPublicacion" type="number" formControlName="anioPublicacion"
          placeholder="Ej: 1967"
          [class.input-error]="anioPublicacion?.invalid && anioPublicacion?.touched"/>
        <span class="error-msg" *ngIf="anioPublicacion?.errors?.['required'] && anioPublicacion?.touched">El año es obligatorio.</span>
        <span class="error-msg" *ngIf="(anioPublicacion?.errors?.['min'] || anioPublicacion?.errors?.['max']) && anioPublicacion?.touched">Año no válido.</span>
      </div>

      <!-- ISBN -->
      <div class="form-group">
        <label for="isbn">ISBN *</label>
        <input id="isbn" type="text" formControlName="isbn"
          placeholder="Ej: 978-3-16-148410-0"
          [class.input-error]="isbn?.invalid && isbn?.touched"/>
        <span class="error-msg" *ngIf="isbn?.errors?.['required'] && isbn?.touched">El ISBN es obligatorio.</span>
        <span class="error-msg" *ngIf="isbn?.errors?.['pattern'] && isbn?.touched">Formato de ISBN no válido.</span>
      </div>

      <!-- Botones -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="guardando()">
          {{ guardando() ? 'Guardando...' : (editando() ? 'Actualizar' : 'Guardar') }}
        </button>
        <a routerLink="/libros" class="btn btn-secondary">Cancelar</a>
      </div>

    </form>
  </div>
</div>
